name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"

      # rashid 0.4.x, the range tests/test_conformance.py checks at run time
      # and the one the other portolan-mirrors catalogs validate with.
      # stac-node-validator at the release the Portolan registry pins (see
      # tests/stac-node-validator/package.json), so this gate checks what the
      # registry checks.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install the validators
        run: |
          python -m pip install 'rashid>=0.4.0,<0.5.0'
          npm ci --prefix tests/stac-node-validator --no-audit --no-fund

      - name: Lint the tooling
        run: |
          python -m pip install ruff
          ruff check --select F tools tests

      # CI_LIGHT exempts asset hrefs with a data suffix from the link check.
      # The checkout holds the metadata and not the bytes. Structural links
      # and every non-data asset still resolve. Leave it unset locally.
      - name: Catalog gates
        env:
          CI_LIGHT: "1"
        run: python3 tests/run_all.py
