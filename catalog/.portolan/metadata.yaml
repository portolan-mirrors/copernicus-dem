# .portolan/metadata.yaml: catalog root. Collections inherit these fields
# unless their own metadata.yaml overrides them.

title: "Copernicus DEM GLO-30, release 2024_1"
description: >-
  A Portolan mirror of the Copernicus DEM GLO-30, release 2024_1: the global
  30 m digital surface model from the TanDEM-X mission, produced by DLR and
  Airbus Defence and Space and provided under Copernicus by the European Union
  and ESA. It holds all 26,475 one-degree tiles, each with its elevation model
  and four quality layers (height error, editing, filling and water body
  masks), as cloud-optimized GeoTIFFs with embedded statistics, re-encoded
  losslessly so pixel values match the source exactly. Read
  [AGENTS.md](AGENTS.md) before you query.

